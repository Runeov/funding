[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 500
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"
]

[fmt]
line_length = 88
tab_width = 4
bracket_spacing = true
